<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CineForge stage</title>
<script type="importmap">{"imports":{"three":"/vendor/three.module.js"}}</script>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<pre id="out">pending</pre>
<script type="module">
import { runPlan } from './stage-runner.js';
// Plan is served at /plan.json by the verification harness (or by the studio when CineForge is enabled).
fetch('/plan.json').then((r) => r.json()).then((plan) => runPlan(document.getElementById('c'), plan))
  .then((result) => { document.getElementById('out').textContent = JSON.stringify(result); })
  .catch((e) => { document.getElementById('out').textContent = JSON.stringify({ error: String(e && e.message || e) }); });
</script>
</body>
</html>
